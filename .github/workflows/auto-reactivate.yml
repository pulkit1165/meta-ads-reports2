name: Auto-reactivate recovered campaigns (hourly at :45 IST)

# LIVE: re-activates campaigns via Meta API when a PAUSED campaign that spent
# today has climbed to 1d_click ROAS >= 1.7 (late attribution after a close).
# Guardrails + audit log in scripts/v2/auto_reactivate.py — one revive per
# campaign per day, ₹500 spend floor. Set DRY_RUN: "1" below to disarm.
# EC2 crontab is the primary scheduler; this is the off-box backup (both are
# idempotent: re-activating an ACTIVE campaign is a no-op).

on:
  schedule:
    # Hourly at :45 IST (= :15 UTC)
    - cron: "15 * * * *"
  workflow_dispatch:

concurrency:
  group: auto-reactivate
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      GOOGLE_SERVICE_ACCOUNT_FILE: ${{ github.workspace }}/google-service-account.json
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      TZ: Asia/Kolkata

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Load sheet IDs
        run: |
          grep -E '^[A-Z][A-Z0-9_]*=' config/sheets.env >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write Google service account file
        env:
          SA_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          printf '%s' "$SA_JSON" > "$GOOGLE_SERVICE_ACCOUNT_FILE"
          chmod 600 "$GOOGLE_SERVICE_ACCOUNT_FILE"

      - name: Restore state branch
        uses: ./.github/actions/state-sync
        with:
          direction: restore

      - name: Run auto-reactivate
        run: python3 scripts/v2/auto_reactivate.py

      - name: Save state branch
        if: always()
        uses: ./.github/actions/state-sync
        with:
          direction: save
