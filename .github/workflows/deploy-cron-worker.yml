name: Deploy Cron Pinger Worker

# Auto-deploys the Cloudflare Worker that pings the today-live workflow
# every hour at IST :50. See cron-worker/README.md for setup details.

# MANUAL-ONLY since 6 Aug 2026: the repo migration (meta-ads-reports2) never got
# the CLOUDFLARE_API_TOKEN + WORKFLOW_DISPATCH_PAT secrets, so every push-triggered
# run failed and emailed the operator. Worker deploys happen from the operator's
# Mac via `wrangler deploy` (OAuth). To re-enable CI deploys: create a Cloudflare
# API token (Workers Scripts:Edit), add both secrets, restore the push trigger.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify GitHub PAT secret is set
        run: |
          if [ -z "${{ secrets.WORKFLOW_DISPATCH_PAT }}" ]; then
            echo "::error::WORKFLOW_DISPATCH_PAT secret is not set."
            echo "::error::See cron-worker/README.md for the 60-second setup."
            exit 1
          fi
          echo "PAT secret found ✓"

      - name: Deploy Worker via wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cron-worker
          # Pin wrangler to avoid the "npx canceled due to missing packages"
          # interactive-prompt failure on fresh runners.
          wranglerVersion: '3.99.0'
          command: deploy
          # Stream the GH PAT into Worker secrets at deploy time so the Worker
          # can authenticate to the GitHub API. The secret is never logged.
          secrets: |
            GITHUB_PAT
            WA_ACCESS_TOKEN
            WA_PHONE_NUMBER_ID
        env:
          GITHUB_PAT: ${{ secrets.WORKFLOW_DISPATCH_PAT }}
          WA_ACCESS_TOKEN: ${{ secrets.WA_ACCESS_TOKEN }}
          WA_PHONE_NUMBER_ID: ${{ secrets.WA_PHONE_NUMBER_ID }}
