name: Fastrr -> Shopify order sync

# Shiprocket's custom-platform checkout collects payment but does NOT create
# the order in Shopify — the seller has to. This job is that missing half.
# It runs continuously so a paid order can never sit unfulfilled again.
#
# Manual run: Actions -> this workflow -> "Run workflow" (set days for a backfill).

on:
  workflow_dispatch:
    inputs:
      days:
        description: 'How many days back to reconcile'
        default: '2'
      apply:
        description: 'Actually create orders (false = dry run)'
        type: boolean
        default: true
  schedule:
    - cron: '*/15 * * * *'   # every 15 minutes

concurrency:
  group: fastrr-order-sync      # never let two runs create the same order
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Reconcile paid Fastrr orders into Shopify
        working-directory: studd-muffyn-app/data
        env:
          FASTRR_API_KEY: ${{ secrets.FASTRR_API_KEY }}
          FASTRR_API_SECRET: ${{ secrets.FASTRR_API_SECRET }}
          SHOPIFY_STORE_URL: ${{ secrets.SHOPIFY_STORE_URL }}
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
          SHOPIFY_API_VERSION: '2024-10'
        run: |
          DAYS="${{ github.event.inputs.days || '2' }}"
          if [ "${{ github.event.inputs.apply }}" = "false" ]; then
            python3 fastrr_reconcile.py --days "$DAYS"
          else
            python3 fastrr_reconcile.py --days "$DAYS" --apply
          fi

      - name: Save sync state
        run: |
          git config user.name  "meta-ads-bot"
          git config user.email "bot@users.noreply.github.com"
          git add studd-muffyn-app/data/fastrr_synced.json || true
          if git diff --cached --quiet; then
            echo "nothing new synced"
          else
            git commit -m "fastrr: record synced orders [skip ci]"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi
