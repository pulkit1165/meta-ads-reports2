name: Daily ops report (9 AM IST)

# Writes the "📋 <day>" tab into the Meta Ads Reports (GHA) sheet every
# morning, covering yesterday: 80/20 new-budget rule, 70/30 core rule (core
# list lives in the operator-editable "⚙️ Core Products" tab), budget
# utilisation, Shopify-blended ROAS, product transition, 6 PM-onwards split.
# See scripts/v2/daily_ops_report.py.
on:
  schedule:
    # Two ticks because GitHub skips ~1/3 of cron firings; the script is
    # idempotent (drops + rewrites the same tab).
    - cron: "30 3 * * *"        # 09:00 IST
    - cron: "0 4 * * *"         # 09:30 IST backup
  workflow_dispatch:
    inputs:
      date:
        description: "Report date YYYY-MM-DD (blank = yesterday IST)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Kolkata
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install --quiet gspread requests python-dotenv

      - name: Write Google service account file
        env:
          SA_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          printf '%s' "$SA_JSON" > google-service-account.json
          chmod 600 google-service-account.json

      - name: Restore databases + finals
        run: |
          set -e
          mkdir -p state
          git fetch --depth=1 origin state:refs/remotes/origin/state
          git show origin/state:ntn.db.gz | gunzip > state/ntn.db
          git fetch --depth=1 origin camp-snapshots:refs/remotes/origin/camp-snapshots
          git show origin/camp-snapshots:camp_snapshots.db.gz | gunzip > state/camp_snapshots.db
          git show origin/camp-snapshots:daily_finals.json > state/daily_finals.json

      - name: Build + write report tab
        run: |
          ARGS=""
          [ -n "${{ github.event.inputs.date }}" ] && ARGS="--date ${{ github.event.inputs.date }}"
          python3 scripts/v2/daily_ops_report.py $ARGS
