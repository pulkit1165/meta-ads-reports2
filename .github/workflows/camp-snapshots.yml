name: Camp hourly snapshots + live ROAS dashboard

# Hourly: snapshot every ACTIVE campaign's pixel metrics into camp_snapshots.db
# (kept on the dedicated `camp-snapshots` branch, 365-day retention), then
# rebuild the live ROAS dashboard. Shares the `camp-live` concurrency group with
# camp-alerts so the two never write the snapshot DB at the same time.
on:
  schedule:
    # 3x/hour attempts, but camp_snapshot.py gates itself: only the FIRST run
    # at/after :00 pulls (one complete-hour measurement, stamped when the hour
    # turns); the :20/:40 runs are retries that no-op once the hour is captured.
    # GitHub cron skips ~1/3 of ticks, so three attempts per hour ensures every
    # hour still gets captured (no gaps in the hourly ROAS matrix).
    - cron: "0,20,40 * * * *"
  workflow_dispatch:

concurrency:
  group: camp-live             # shared with camp-alerts.yml — serialize DB writes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      TZ: Asia/Kolkata
      DB: state/camp_snapshots.db
      SNAP_BRANCH: camp-snapshots
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }

      - name: Set up Python
        uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }

      - name: Install gspread (for the Google Sheet push)
        run: pip install gspread

      - name: Write Google service account file
        env:
          SA_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          printf '%s' "$SA_JSON" > google-service-account.json
          chmod 600 google-service-account.json

      - name: Restore snapshot DB from branch
        run: |
          set -e
          mkdir -p state
          if git ls-remote --exit-code --heads origin "$SNAP_BRANCH" >/dev/null 2>&1; then
            git fetch --depth=1 origin "$SNAP_BRANCH:refs/remotes/origin/$SNAP_BRANCH"
            if git cat-file -e "origin/$SNAP_BRANCH:camp_snapshots.db.gz" 2>/dev/null; then
              git show "origin/$SNAP_BRANCH:camp_snapshots.db.gz" | gunzip > "$DB"
              echo "restored DB ($(du -h "$DB" | cut -f1))"
            fi
          else
            echo "no snapshot branch yet — fresh DB"
          fi

      - name: Hold until the :58 IST boundary
        run: |
          M=$(TZ=Asia/Kolkata date +%-M); S=$(TZ=Asia/Kolkata date +%-S)
          # The Worker dispatches at :55 so the runner is warmed up; the
          # measurement itself must not happen before :58 (gate skips it).
          if [ "$M" -ge 50 ] && [ "$M" -lt 58 ]; then
            WAIT=$(( (58 - M) * 60 - S + 3 ))
            echo "holding ${WAIT}s for the :58 boundary"; sleep "$WAIT"
          fi

      - name: Collect hourly snapshot (all active campaigns)
        run: python3 scripts/v2/camp_snapshot.py --db "$DB"

      # ── :58 hourly WhatsApp report: fresh sales overlay → table → deploy → send ──
      - name: Build hourly WhatsApp table (complete hour @ :58)
        continue-on-error: true    # report path must never break the snapshot save
        env:
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
          SHOPIFY_STORE_URL: ${{ secrets.SHOPIFY_STORE_URL }}
          SHOPIFY_ACCESS_TOKEN_NBP: ${{ secrets.SHOPIFY_ACCESS_TOKEN_NBP }}
          SHOPIFY_STORE_URL_NBP: ${{ secrets.SHOPIFY_STORE_URL_NBP }}
          SHOPIFY_ACCESS_TOKEN_SML: ${{ secrets.SHOPIFY_ACCESS_TOKEN_SML }}
          SHOPIFY_STORE_URL_SML: ${{ secrets.SHOPIFY_STORE_URL_SML }}
        run: |
          pip install pillow -q
          git fetch --depth=1 origin state:refs/remotes/origin/state || true
          git show origin/state:ntn.db.gz | gunzip > state/ntn.db
          git show origin/camp-snapshots:daily_finals.json > state/daily_finals.json 2>/dev/null || echo '{}' > state/daily_finals.json
          python3 scripts/v2/wa_overlay_orders.py --ntn-db state/ntn.db
          python3 scripts/v2/build_wa_table.py             --snap-db "$DB" --ntn-db state/ntn.db --finals state/daily_finals.json             --out-json roas-live/wa_table.json --out-png roas-live/wa_table.png
          # yday_report must ride EVERY roas-live deploy, else this hourly
          # deploy wipes it off the site and the 8 AM send finds a 404.
          python3 scripts/v2/build_yday_report.py             --snap-db "$DB" --finals state/daily_finals.json             --out roas-live/yday_report.json

      - name: Deploy table + notify Worker to send
        continue-on-error: true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -f roas-live/wa_table.json ] && [ -n "$VERCEL_TOKEN" ]; then
            # This checkout NEVER has index.html (gitignored; only roas-email
            # generates it), so deploying roas-live/ as-is replaces the whole
            # site with a page-less version — that was the 404 flip-flop that
            # took the dashboard down every ~20 min (26-29 Jul). Stage a copy,
            # pull the CURRENT live page files in beside the fresh table, and
            # skip the deploy entirely if the live page can't be fetched —
            # roas-email redeploys the full site within 10 minutes anyway.
            export VERCEL_ORG_ID=team_AocNAz8F008iWPSLVvar2Xb5
            export VERCEL_PROJECT_ID=prj_9k4XP9HZFUWINYpbPAYEe2OtRZOB
            STAGE=$(mktemp -d)
            rsync -a --exclude '.vercel' --exclude '.gitignore' --exclude 'reports' roas-live/ "$STAGE"/
            for f in index.html summary.json status.json; do
              curl -fsS --max-time 20 "https://roas-live.vercel.app/$f" -o "$STAGE/$f" || true
            done
            if [ -s "$STAGE/index.html" ]; then
              npx --yes vercel@latest deploy "$STAGE" --prod --yes --token="$VERCEL_TOKEN"
            else
              echo "live page unreachable — skipping deploy so we never ship a page-less site"
            fi
            curl -s "https://meta-ads-cron-pinger.pulkit-studdmuffyn.workers.dev/notify-hourly?key=ntnhourly2026" | head -c 200
          fi

      - name: Build live ROAS dashboard
        run: python3 scripts/v2/build_live_roas_dashboard.py --db "$DB" --out live-roas/index.html

      - name: Push live tracker to Google Sheet
        continue-on-error: true   # a sheet blip must never fail the snapshot/save
        env:
          GOOGLE_SERVICE_ACCOUNT_FILE: google-service-account.json
        run: |
          python3 scripts/v2/push_live_roas_to_sheet.py --db "$DB" \
            --sheet 1eW2_qPdsKJ8zAV5-hsXA5HtfVH9NwDhQLyHYGKz5hXk \
            --tab "Live ROAS Tracker"

      - name: Save DB + dashboard to branch
        run: |
          set -e
          git config user.name  "meta-ads-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          WT=.camp-wt; git worktree remove -f "$WT" 2>/dev/null || true; rm -rf "$WT"
          if git ls-remote --exit-code --heads origin "$SNAP_BRANCH" >/dev/null 2>&1; then
            git worktree add -f "$WT" "origin/$SNAP_BRANCH"
          else
            git worktree add -f --orphan -b "$SNAP_BRANCH" "$WT"; ( cd "$WT" && git rm -rf . 2>/dev/null || true )
          fi
          gzip -c "$DB" > "$WT/camp_snapshots.db.gz"
          mkdir -p "$WT/live-roas"; cp live-roas/index.html "$WT/live-roas/index.html"
          cd "$WT"; git add -A
          if git diff --staged --quiet; then echo "no change"; exit 0; fi
          git commit -m "camp-snapshots: $(date -u +%FT%TZ)"
          for i in 1 2 3; do
            git push --force origin "$(git commit-tree "$(git write-tree)" -m "camp-snapshots $(date -u +%FT%TZ)")":refs/heads/"$SNAP_BRANCH" && { echo pushed; break; }
            echo "retry $i"; git fetch origin "$SNAP_BRANCH"; git reset --hard "origin/$SNAP_BRANCH"
            gzip -c "../$DB" > camp_snapshots.db.gz; cp ../live-roas/index.html live-roas/index.html
            git add -A; git commit -m "camp-snapshots overlay $(date -u +%FT%TZ)" || true
          done

      # Optional: publish the dashboard to Vercel. No-op until LIVE_ROAS_PROJECT_ID
      # var + VERCEL_TOKEN secret are set, so safe to merge immediately.
      - name: Deploy dashboard to Vercel
        if: ${{ vars.LIVE_ROAS_PROJECT_ID != '' }}
        continue-on-error: true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_AocNAz8F008iWPSLVvar2Xb5
          VERCEL_PROJECT_ID: ${{ vars.LIVE_ROAS_PROJECT_ID }}
        run: |
          [ -z "$VERCEL_TOKEN" ] && { echo "no VERCEL_TOKEN — skip"; exit 0; }
          npx --yes vercel@latest deploy live-roas --prod --yes --token="$VERCEL_TOKEN"
