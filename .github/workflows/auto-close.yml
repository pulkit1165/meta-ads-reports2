name: Auto-close low-ROAS campaigns (hourly, from 12:01 AM IST)

# LIVE: pauses campaigns via Meta API when spend >= 40% of daily budget
# AND today's 1d_click ROAS <= 0.4. Guardrails + audit log in
# scripts/v2/auto_close.py. Set DRY_RUN: "1" below to disarm without deleting.

on:
  schedule:
    # Every hour at :01 IST, all day starting 12:01 AM IST (= :31 UTC)
    - cron: "31 * * * *"
  workflow_dispatch:

concurrency:
  group: auto-close
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      GOOGLE_SERVICE_ACCOUNT_FILE: ${{ github.workspace }}/google-service-account.json
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      TZ: Asia/Kolkata

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Load sheet IDs
        run: |
          grep -E '^[A-Z][A-Z0-9_]*=' config/sheets.env >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write Google service account file
        env:
          SA_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          printf '%s' "$SA_JSON" > "$GOOGLE_SERVICE_ACCOUNT_FILE"
          chmod 600 "$GOOGLE_SERVICE_ACCOUNT_FILE"

      - name: Restore state branch
        uses: ./.github/actions/state-sync
        with:
          direction: restore

      - name: Run auto-close
        run: python3 scripts/v2/auto_close.py

      - name: Save state branch
        if: always()
        uses: ./.github/actions/state-sync
        with:
          direction: save
